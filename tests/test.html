<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>PsychoVocab - Tests</title>
  <style>
    body { font-family: monospace; padding: 1.5rem; background: #111; color: #eee; }
    .pass { color: #6f6; }
    .fail { color: #f66; font-weight: bold; }
    #summary { font-size: 1.2rem; margin-bottom: 1rem; }
    li { margin-bottom: 0.4rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>PsychoVocab logic tests</h1>
  <p>Open this file directly (or serve the project) after changing js/app.js to check the spaced-repetition,
     tier, and leech logic haven't regressed. Not a full DOM/UI test - just the core state machine.</p>
  <div id="summary">Running...</div>
  <ul id="results"></ul>

  <!-- Same markup app.js's render() reaches for by id, so a full app boot
       (including render()) doesn't throw before the test runner takes over. -->
  <div class="stats-container">
    <div class="stat-card"><div class="stat-value" id="total-mastered">0</div></div>
    <div class="stat-card"><div class="stat-value" id="total-remaining">0</div></div>
    <div class="stat-card"><div class="stat-value" id="current-streak">0</div></div>
    <div class="stat-card"><div class="stat-value" id="sessions-today">0</div></div>
  </div>
  <div id="app-content"></div>
  <div id="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header" id="modal-title"></div>
      <div class="modal-content" id="modal-body"></div>
    </div>
  </div>
  <input type="file" id="file-import" accept=".json">

  <!-- Real app scripts, no Firebase SDK loaded - firebase-init.js's
       firebase.initializeApp() throws (firebase is undefined), which it
       already catches and treats as "Firebase not configured", so the app
       falls back to plain localStorage exactly like a browser with the
       Firebase SDK blocked/offline would. -->
  <script src="../js/config.js"></script>
  <script src="../js/words-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/firebase-init.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>

  <script>
    // --- tiny test runner -----------------------------------------------
    // test() only registers a case; they all run (in order, awaited one at
    // a time) from the async runner at the bottom of this file, after every
    // test() call below has finished registering. This lets a case be an
    // async function (needed for anything going through a real Promise
    // chain, like logout()) without the report section racing ahead of it.
    const results = [];
    const testCases = [];
    function test(name, fn) {
      testCases.push({ name, fn });
    }
    function assert(cond, msg) {
      if (!cond) throw new Error(msg || 'assertion failed');
    }
    function assertEqual(actual, expected, msg) {
      if (actual !== expected) {
        throw new Error(`${msg || 'not equal'}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
      }
    }

    // --- fixtures ----------------------------------------------------------
    function makeWord(overrides) {
      return Object.assign({
        id: Math.random(),
        english: 'test', hebrew: 'בדיקה', example: 'A test sentence.', emoji: '📚',
        status: 'red', streak: 0, association: '', difficulty: 'easy', testProbability: 0.5,
        dueAt: null, flagged: false, updatedAt: null, failCount: 0, leech: false
      }, overrides);
    }

    // app is booted for real by app.js (see `window.app = app` at the end
    // of js/app.js) - silence the side effects we don't want firing
    // between isolated test cases (re-render, modals, Firebase writes,
    // which are already no-ops since Firebase isn't loaded here).
    app.render = () => {};
    app.saveProgress = () => {};
    app.showLeechModal = () => {};
    app.showTierUnlockedModal = () => {};
    app.showRestingModal = () => {};
    app.recordStudySession = () => {};
    app.startBreakTimer = () => {};
    app.maybeCelebrateStreak = () => {};

    // ==== getCurrentTier ====================================================

    test('getCurrentTier: fresh data starts on easy', () => {
      app.words = [makeWord({ difficulty: 'easy', status: 'red' })];
      assertEqual(app.getCurrentTier(), 'easy');
    });

    test('getCurrentTier: advances once every easy word is green', () => {
      app.words = [
        makeWord({ difficulty: 'easy', status: 'green' }),
        makeWord({ difficulty: 'moderate', status: 'red' })
      ];
      assertEqual(app.getCurrentTier(), 'moderate');
    });

    test('getCurrentTier: a lone leech word does not block the tier from advancing', () => {
      // Regression: a leech word can never turn green (leeching only
      // happens on repeated wrong answers), so requiring every word to be
      // green would strand the learner on this tier forever once any word
      // becomes a leech - see js/app.js getCurrentTier().
      app.words = [
        makeWord({ difficulty: 'easy', status: 'green' }),
        makeWord({ difficulty: 'easy', status: 'red', leech: true }),
        makeWord({ difficulty: 'moderate', status: 'red' })
      ];
      assertEqual(app.getCurrentTier(), 'moderate');
    });

    test('getCurrentTier: an ordinary (non-leech) unfinished word still blocks the tier', () => {
      app.words = [
        makeWord({ difficulty: 'easy', status: 'green' }),
        makeWord({ difficulty: 'easy', status: 'red', leech: false }),
        makeWord({ difficulty: 'moderate', status: 'red' })
      ];
      assertEqual(app.getCurrentTier(), 'easy');
    });

    test('startNewSession: does not silently no-op when the only non-green easy word is a leech', () => {
      // Regression: startNewSession() excludes leeches from its pool, so if
      // getCurrentTier() still reported 'easy' here, tierWords would be
      // empty and the session would fail to start with no feedback at all.
      app.words = [
        makeWord({ difficulty: 'easy', status: 'green' }),
        makeWord({ difficulty: 'easy', status: 'red', leech: true }),
        makeWord({ difficulty: 'moderate', status: 'red' }),
        makeWord({ difficulty: 'moderate', status: 'red' })
      ];
      app.sessionActive = false;
      app.currentSession = [];
      app.startNewSession();
      assert(app.currentSession.length > 0, 'expected a session to start');
      assert(app.currentSession.every(w => w.difficulty === 'moderate'), 'expected words drawn from the moderate tier');
    });

    // ==== markWordUnknown / leech threshold =================================

    test('markWordUnknown: word becomes a leech after 4 total fails and leaves the session', () => {
      const w = makeWord({ status: 'red', failCount: 3 });
      app.currentSession = [w];
      app.sessionStats = { correct: 0, incorrect: 0, streak: 0 };
      app.allTimeStats = { totalAttempts: 0, totalCorrect: 0 };
      app.markWordUnknown(w);
      assertEqual(w.failCount, 4);
      assert(w.leech === true, 'expected word to become a leech at failCount 4');
      assertEqual(app.currentSession.length, 0, 'expected the leech to be pulled out of the session, not requeued');
    });

    test('markWordUnknown: below the leech threshold, the word is requeued to the back', () => {
      const w = makeWord({ status: 'orange', failCount: 0 });
      const other = makeWord({ status: 'red' });
      app.currentSession = [w, other];
      app.sessionStats = { correct: 0, incorrect: 0, streak: 0 };
      app.allTimeStats = { totalAttempts: 0, totalCorrect: 0 };
      app.markWordUnknown(w);
      assertEqual(w.status, 'red', 'orange -> red on a miss');
      assertEqual(w.leech, false);
      assertEqual(app.currentSession[app.currentSession.length - 1], w, 'expected the missed word at the back of the queue');
    });

    // ==== markWordKnown / spaced repetition =================================

    test('markWordKnown: first correct answer rests for ~4 hours (red -> orange)', () => {
      const w = makeWord({ status: 'red' });
      app.currentSession = [w];
      const before = Date.now();
      app.markWordKnown(w);
      assertEqual(w.status, 'orange');
      assertEqual(w.streak, 1);
      const fourHours = 4 * 60 * 60 * 1000;
      assert(Math.abs(w.dueAt - (before + fourHours)) < 5000, 'expected dueAt ~4h from now');
    });

    test('markWordKnown: second correct answer masters the word (orange -> green)', () => {
      const w = makeWord({ status: 'orange', streak: 1 });
      app.currentSession = [w];
      app.markWordKnown(w);
      assertEqual(w.status, 'green');
      assertEqual(w.streak, 2);
      assertEqual(w.dueAt, null);
    });

    test('markWordKnown: forceMaster jumps straight to green from red', () => {
      const w = makeWord({ status: 'red' });
      app.currentSession = [w];
      app.markWordKnown(w, true);
      assertEqual(w.status, 'green');
      assertEqual(w.streak, 2);
      assertEqual(w.dueAt, null);
    });

    test('markWordKnown: reaching green clears prior leech history', () => {
      const w = makeWord({ status: 'orange', streak: 1, leech: true, failCount: 5 });
      app.currentSession = [w];
      app.markWordKnown(w);
      assertEqual(w.status, 'green');
      assertEqual(w.leech, false, 'mastering a word should clear its leech flag');
    });

    // ==== weightedRandomSelection ============================================

    test('weightedRandomSelection: returns exactly `count` unique words when enough are available', () => {
      const pool = Array.from({ length: 10 }, () => makeWord({ testProbability: 0.5 }));
      const selected = app.weightedRandomSelection(pool, 7);
      assertEqual(selected.length, 7);
      assertEqual(new Set(selected.map(w => w.id)).size, 7, 'expected no duplicate words');
    });

    test('weightedRandomSelection: returns every word when count exceeds the pool size', () => {
      const pool = Array.from({ length: 3 }, () => makeWord({ testProbability: 0.9 }));
      const selected = app.weightedRandomSelection(pool, 7);
      assertEqual(selected.length, 3);
    });

    // ==== renderSessionEnd summary text ======================================

    test('renderSessionEnd: an emptied session (last word pulled out as a leech) does not claim "mastered"', () => {
      // Regression: totalWords - masteredInSession both being 0 previously
      // hit the "mastered everything" branch, which is backwards - the
      // word left because it became a leech, not because it was mastered.
      app.currentSession = [];
      app.sessionStats = { correct: 0, incorrect: 1, streak: 0 };
      const container = document.createElement('div');
      app.renderSessionEnd(container);
      assert(!container.innerHTML.includes('שלטת בכל <strong>0</strong>'), 'should not claim 0 words were mastered as a celebration');
      assert(container.innerHTML.includes('עקשנית'), 'should explain the word became a leech');
    });

    test('renderSessionEnd: a normal finished session still reports mastered count', () => {
      const w1 = makeWord({ status: 'green' });
      const w2 = makeWord({ status: 'green' });
      app.currentSession = [w1, w2];
      app.sessionStats = { correct: 2, incorrect: 0, streak: 2 };
      const container = document.createElement('div');
      app.renderSessionEnd(container);
      assert(container.innerHTML.includes('שלטת בכל <strong>2</strong>'), 'expected the normal "mastered all N" message');
    });

    // ==== startNewSession pool selection =====================================

    // startNewSession() builds its candidate pool inline rather than via a
    // separate method, so to test the pool itself (not just whatever 7
    // words randomly end up in the session) we swap out
    // weightedRandomSelection for the duration of one test to capture
    // exactly which words it was handed, then restore the real method.
    function captureSessionPool(setup) {
      let captured = null;
      app.weightedRandomSelection = (words, count) => {
        captured = words;
        return words.slice(0, count);
      };
      try {
        setup();
        app.sessionActive = false;
        app.currentSession = [];
        app.startNewSession();
      } finally {
        delete app.weightedRandomSelection; // fall back to the real prototype method
      }
      return captured;
    }

    test('startNewSession pool: includes every already-started word plus room for new ones', () => {
      const started = Array.from({ length: 5 }, (_, i) => makeWord({ id: `started-${i}`, difficulty: 'easy', status: 'red', updatedAt: Date.now() }));
      const notStarted = Array.from({ length: 10 }, (_, i) => makeWord({ id: `new-${i}`, difficulty: 'easy', status: 'red', updatedAt: null }));
      const pool = captureSessionPool(() => { app.words = [...started, ...notStarted]; });
      assert(pool !== null, 'expected startNewSession to reach weightedRandomSelection');
      assertEqual(pool.length, 15, 'expected all 5 started + all 10 new words (well under the 30-word active-pool cap)');
    });

    test('startNewSession pool: caps brand-new words once started words alone fill the active pool', () => {
      // ACTIVE_POOL_SIZE is 30 - once 30 already-started words exist, there
      // is no room left for the "introduce new material gradually" slice,
      // so no never-attempted word should be pulled in at all.
      const started = Array.from({ length: 30 }, (_, i) => makeWord({ id: `started-${i}`, difficulty: 'easy', status: 'red', updatedAt: Date.now() }));
      const notStarted = Array.from({ length: 5 }, (_, i) => makeWord({ id: `new-${i}`, difficulty: 'easy', status: 'red', updatedAt: null }));
      const pool = captureSessionPool(() => { app.words = [...started, ...notStarted]; });
      assertEqual(pool.length, 30, 'expected only the 30 started words, no new ones squeezed in');
      assert(pool.every(w => String(w.id).startsWith('started-')), 'no never-attempted word should appear once the active pool is already full');
    });

    test('startNewSession pool: excludes leech words even when otherwise due', () => {
      const leeches = Array.from({ length: 2 }, (_, i) => makeWord({ id: `leech-${i}`, difficulty: 'easy', status: 'red', leech: true, updatedAt: Date.now() }));
      const normal = Array.from({ length: 3 }, (_, i) => makeWord({ id: `normal-${i}`, difficulty: 'easy', status: 'red', updatedAt: Date.now() }));
      const pool = captureSessionPool(() => { app.words = [...leeches, ...normal]; });
      assertEqual(pool.length, 3, 'expected only the 3 non-leech words');
      assert(pool.every(w => !w.leech), 'no leech word should ever enter the candidate pool');
    });

    test('startNewSession pool: a resting orange word (dueAt in the future) is not due yet', () => {
      const resting = makeWord({ id: 'resting', difficulty: 'easy', status: 'orange', updatedAt: Date.now(), dueAt: Date.now() + 60 * 60 * 1000 });
      const due = makeWord({ id: 'due', difficulty: 'easy', status: 'orange', updatedAt: Date.now(), dueAt: Date.now() - 1000 });
      const pool = captureSessionPool(() => { app.words = [resting, due]; });
      assertEqual(pool.length, 1, 'expected only the word whose rest period has already passed');
      assertEqual(pool[0].id, 'due');
    });

    // ==== session resume: restoreSession / loadState =========================

    test('restoreSession: resumes the saved words in the saved order', () => {
      const words = [makeWord({ id: 1 }), makeWord({ id: 2 }), makeWord({ id: 3 })];
      const data = { sessionActive: true, sessionWordIds: [3, 1], sessionStats: { correct: 2, incorrect: 1, streak: 1 } };
      app.restoreSession(data, words);
      assertEqual(app.sessionActive, true);
      assertEqual(app.currentSession.map(w => w.id).join(','), '3,1', 'expected the exact saved order to be preserved');
      assertEqual(app.sessionStats.correct, 2);
    });

    test('restoreSession: sessionActive:false in the saved data means nothing to resume', () => {
      const words = [makeWord({ id: 1 }), makeWord({ id: 2 })];
      app.restoreSession({ sessionActive: false, sessionWordIds: [1, 2] }, words);
      assertEqual(app.sessionActive, false);
      assertEqual(app.currentSession.length, 0);
    });

    test('restoreSession: a saved session whose words no longer exist resumes as empty, not a crash', () => {
      // e.g. the word dataset changed between visits and those ids are gone.
      const words = [makeWord({ id: 1 })];
      app.restoreSession({ sessionActive: true, sessionWordIds: [999, 998] }, words);
      assertEqual(app.sessionActive, false);
      assertEqual(app.currentSession.length, 0);
    });

    // loadState() reads from the real localStorage under STORAGE_KEY (see
    // js/storage.js) - the same key the live app uses to persist actual
    // progress. Back up and restore it around every test here so running
    // this suite can never destroy real saved progress on this device.
    function withSavedLocalStorage(fn) {
      const backup = localStorage.getItem(STORAGE_KEY);
      try {
        fn();
      } finally {
        if (backup === null) localStorage.removeItem(STORAGE_KEY);
        else localStorage.setItem(STORAGE_KEY, backup);
      }
    }

    test('loadState: merges saved per-word progress onto the current words by id', () => {
      withSavedLocalStorage(() => {
        app.words = [makeWord({ id: 1, status: 'red', streak: 0 }), makeWord({ id: 2, status: 'red', streak: 0 })];
        saveToLocalStorage({
          words: [{ id: 1, status: 'green', streak: 2, association: 'x', dueAt: null, flagged: false, updatedAt: 123, failCount: 0, leech: false }],
          allTimeStats: { totalAttempts: 5, totalCorrect: 3 },
          currentStreak: 2, sessionsToday: 1, lastStudyDate: '2026-08-01', studyHistory: {},
          lastSaved: new Date().toISOString(), sessionActive: false, sessionWordIds: []
        });
        app.userSkippedLogin = false;
        app.loadState();
        assertEqual(app.words.find(w => w.id === 1).status, 'green', 'saved progress should apply to the matching word');
        assertEqual(app.words.find(w => w.id === 2).status, 'red', 'a word absent from the save should keep its current state, not be reset');
        assertEqual(app.allTimeStats.totalAttempts, 5);
        assertEqual(app.userSkippedLogin, true, 'having any saved local progress implies a guest has used this device before');
      });
    });

    test('loadState: resumes an in-progress session, with the merged word data already applied', () => {
      withSavedLocalStorage(() => {
        app.words = [makeWord({ id: 10, status: 'red' }), makeWord({ id: 11, status: 'red' })];
        saveToLocalStorage({
          words: [
            { id: 10, status: 'orange', streak: 1, association: '', dueAt: null, flagged: false, updatedAt: Date.now(), failCount: 0, leech: false },
            { id: 11, status: 'red', streak: 0, association: '', dueAt: null, flagged: false, updatedAt: null, failCount: 0, leech: false }
          ],
          allTimeStats: { totalAttempts: 1, totalCorrect: 1 },
          currentStreak: 1, sessionsToday: 1, lastStudyDate: '2026-08-01', studyHistory: {},
          lastSaved: new Date().toISOString(), sessionActive: true, sessionWordIds: [10, 11],
          sessionStats: { correct: 1, incorrect: 0, streak: 1 }
        });
        app.loadState();
        assertEqual(app.sessionActive, true);
        assertEqual(app.currentSession.map(w => w.id).join(','), '10,11');
        assertEqual(app.currentSession[0].status, 'orange', 'the resumed session should reference the already-merged word data');
      });
    });

    test('loadState: a saved session referencing since-removed words does not resume', () => {
      withSavedLocalStorage(() => {
        app.words = [makeWord({ id: 20, status: 'red' })];
        saveToLocalStorage({
          words: [{ id: 20, status: 'red', streak: 0, association: '', dueAt: null, flagged: false, updatedAt: null, failCount: 0, leech: false }],
          allTimeStats: { totalAttempts: 0, totalCorrect: 0 },
          currentStreak: 0, sessionsToday: 0, lastStudyDate: null, studyHistory: {},
          lastSaved: new Date().toISOString(), sessionActive: true, sessionWordIds: [999]
        });
        app.loadState();
        assertEqual(app.sessionActive, false);
        assertEqual(app.currentSession.length, 0);
      });
    });

    // ==== getLocalDateKey / streak date boundary ==============================

    test('getLocalDateKey: formats a date as local YYYY-MM-DD, not UTC', () => {
      // A time chosen to sit on different calendar dates in UTC vs a
      // positive-offset local zone (e.g. Israel) - 00:30 local, on a
      // machine east of UTC, is still the previous day in UTC. Regression
      // for recordStudySession() previously using toISOString() (UTC) for
      // this, which could misfire the streak/day count near local midnight.
      const halfPastMidnight = new Date(2026, 7, 25, 0, 30); // months are 0-indexed: August 25
      assertEqual(app.getLocalDateKey(halfPastMidnight), '2026-08-25');
    });

    test('recordStudySession: uses the local calendar day, not UTC, for the streak/history key', () => {
      const original = app.recordStudySession; // currently the no-op override above
      delete app.recordStudySession; // fall back to the real prototype method for this one test
      try {
        app.studyHistory = {};
        app.lastStudyDate = null;
        app.currentStreak = 0;
        app.sessionsToday = 0;
        app.recordStudySession();
        const expectedKey = app.getLocalDateKey();
        assert(app.studyHistory[expectedKey] === 1, 'expected today\'s local-date key in studyHistory');
        assertEqual(app.lastStudyDate, expectedKey);
        assertEqual(app.currentStreak, 1);
      } finally {
        app.recordStudySession = original;
      }
    });

    // ==== logout: no progress leak to the next user on this device ==========

    test('logout: clears in-memory state and this device\'s saved progress', async () => {
      // logout() only does its cleanup inside logoutUser()'s .then(), and
      // the real logoutUser() rejects immediately when Firebase isn't
      // configured (see js/auth.js) - which is always true in this test
      // environment. Stand in a resolving fake for the duration of this
      // one test so the real cleanup path in js/app.js actually runs.
      const originalLogoutUser = window.logoutUser;
      window.logoutUser = () => Promise.resolve();
      // This test's whole point is that logout() deletes STORAGE_KEY from
      // real localStorage - back up whatever was actually there first and
      // restore it in `finally`, or running this suite on a real device
      // (this file is publicly deployed at tests/test.html) would silently
      // and permanently wipe that device's real saved progress.
      const backup = localStorage.getItem(STORAGE_KEY);
      try {
        app.words = [makeWord({ id: 'leaked-word', status: 'green' })];
        app.currentStreak = 5;
        app.studyHistory = { '2026-08-01': 2 };
        app.currentSession = [app.words[0]];
        app.sessionActive = true;
        saveToLocalStorage({
          words: app.words, allTimeStats: { totalAttempts: 9, totalCorrect: 9 },
          currentStreak: 5, sessionsToday: 3, lastStudyDate: '2026-08-01', studyHistory: { '2026-08-01': 2 },
          sessionActive: true, sessionWordIds: ['leaked-word'], sessionStats: { correct: 1, incorrect: 0, streak: 1 },
          lastSaved: new Date().toISOString()
        });

        await app.logout();
        // logout()'s cleanup runs inside a .then() callback chained off the
        // (now faked) logoutUser() promise - app.logout() itself doesn't
        // return that chain, so give the microtask queue a couple of turns
        // to actually run it before asserting.
        await Promise.resolve();
        await Promise.resolve();

        assert(!app.words.some(w => w.id === 'leaked-word'), 'in-memory words should be reset to the fresh dataset, not carry over the outgoing account\'s words');
        assertEqual(app.currentStreak, 0);
        assertEqual(Object.keys(app.studyHistory).length, 0);
        assertEqual(app.sessionActive, false);
        assertEqual(app.currentSession.length, 0);
        assertEqual(loadFromLocalStorage(), null, 'this device\'s saved progress should be cleared, not left for the next guest/account to inherit');
      } finally {
        window.logoutUser = originalLogoutUser;
        if (backup === null) localStorage.removeItem(STORAGE_KEY);
        else localStorage.setItem(STORAGE_KEY, backup);
      }
    });

    // ==== importProgress: validation, confirmation, backwards-compat =========

    function makeFakeFileEvent(jsonText) {
      const file = new File([new Blob([jsonText], { type: 'application/json' })], 'backup.json', { type: 'application/json' });
      return { target: { files: [file], value: '' } };
    }
    // FileReader.readAsText() is asynchronous even for small in-memory
    // blobs (queued as a task, not a microtask) - give it a turn before
    // asserting on whatever importProgress's reader.onload was supposed to do.
    function waitForFileRead() {
      return new Promise(resolve => setTimeout(resolve, 50));
    }

    test('importProgress: a malformed file shape is rejected without touching existing progress', async () => {
      // Regression: the old check was `data.words && data.allTimeStats`
      // (truthy, not shape-checked) and assigned this.words = data.words
      // before any validation of its contents - a file with e.g.
      // words:"oops" got applied, and only crashed later inside the
      // backwards-compat loop / the next render(), by which point
      // this.words was already corrupted with no way back.
      const originalWords = [makeWord({ id: 'keep-me', status: 'orange' })];
      app.words = originalWords;
      app.importProgress(makeFakeFileEvent(JSON.stringify({ words: 'not-an-array', allTimeStats: {} })));
      await waitForFileRead();
      assertEqual(app.words, originalWords, 'a malformed import should never mutate this.words');
    });

    test('importProgress: cancelling the confirmation leaves current progress untouched', async () => {
      // Regression: there used to be no confirmation at all - picking the
      // wrong backup file in the OS file dialog silently and permanently
      // replaced all current progress with no way to undo it.
      const originalConfirm = window.confirm;
      window.confirm = () => false;
      try {
        const originalWords = [makeWord({ id: 'keep-me-2', status: 'orange' })];
        app.words = originalWords;
        const validButDifferentImport = { words: [makeWord({ id: 'from-file' })], allTimeStats: { totalAttempts: 1, totalCorrect: 1 } };
        app.importProgress(makeFakeFileEvent(JSON.stringify(validButDifferentImport)));
        await waitForFileRead();
        assertEqual(app.words, originalWords, 'declining the confirm dialog should not apply the import');
      } finally {
        window.confirm = originalConfirm;
      }
    });

    test('importProgress: a valid, confirmed import replaces progress and backfills missing fields', async () => {
      const originalConfirm = window.confirm;
      window.confirm = () => true;
      const backup = localStorage.getItem(STORAGE_KEY);
      try {
        app.words = [makeWord({ id: 'old-word' })];
        // Deliberately missing association/failCount/leech, simulating a
        // backup exported by an older version of the app.
        const importedWord = { id: 'imported-1', english: 'x', hebrew: 'y', status: 'green', streak: 2, difficulty: 'easy', testProbability: 0.5 };
        app.importProgress(makeFakeFileEvent(JSON.stringify({ words: [importedWord], allTimeStats: { totalAttempts: 3, totalCorrect: 2 } })));
        await waitForFileRead();

        assertEqual(app.words.length, 1);
        assertEqual(app.words[0].id, 'imported-1');
        assertEqual(app.words[0].association, '', 'a missing association field should backfill to an empty string');
        assertEqual(app.words[0].failCount, 0, 'a missing failCount field should backfill to 0');
        assertEqual(app.words[0].leech, false, 'a missing leech field should backfill to false');
        assertEqual(app.allTimeStats.totalAttempts, 3);
      } finally {
        window.confirm = originalConfirm;
        if (backup === null) localStorage.removeItem(STORAGE_KEY);
        else localStorage.setItem(STORAGE_KEY, backup);
      }
    });

    // --- run everything, then report ------------------------------------
    (async () => {
      for (const { name, fn } of testCases) {
        try {
          await fn();
          results.push({ name, pass: true });
        } catch (e) {
          results.push({ name, pass: false, error: e.message });
        }
      }

      const list = document.getElementById('results');
      let passCount = 0;
      for (const r of results) {
        const li = document.createElement('li');
        if (r.pass) {
          passCount++;
          li.className = 'pass';
          li.textContent = `✓ ${r.name}`;
        } else {
          li.className = 'fail';
          li.textContent = `✗ ${r.name}\n  ${r.error}`;
        }
        list.appendChild(li);
      }
      const summary = document.getElementById('summary');
      summary.textContent = `${passCount}/${results.length} passed`;
      summary.className = passCount === results.length ? 'pass' : 'fail';
      console.log(`TESTS: ${passCount}/${results.length} passed`);
      if (passCount !== results.length) {
        console.error('TESTS FAILED', results.filter(r => !r.pass));
      }
    })();
  </script>
</body>
</html>
