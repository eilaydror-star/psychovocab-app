<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PsychoVocab - מערכת שינון מילים באנגלית להכנה פסיכומטרית</title>

  <!-- "Add to Home Screen" support: a real app icon and standalone
       (no browser chrome) window on both iOS and Android. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A7A5A">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PsychoVocab">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body dir="rtl" style="direction: rtl; text-align: right;">
  <div class="container">
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-value" id="total-mastered">0</div>
          <div class="stat-label">שולט</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-remaining">4000</div>
          <div class="stat-label">מילים נותרות</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="current-streak">0</div>
          <div class="stat-label">🔥 רצף ימים</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="sessions-today">0</div>
          <div class="stat-label">🎯 שיעורים היום</div>
        </div>
      </div>
    </div>

    <div id="app-content">
          <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
            <div style="text-align: center;">
              <div style="font-size: 2.5rem; margin-bottom: 1rem;">📚</div>
              <div style="width: 28px; height: 28px; margin: 0 auto; border: 3px solid var(--border-light); border-top-color: var(--sage-green); border-radius: 50%; animation: app-boot-spin 0.8s linear infinite;"></div>
            </div>
          </div>
        </div>
        <style>@keyframes app-boot-spin { to { transform: rotate(360deg); } }</style>

    <div id="modal-overlay" class="modal-overlay" style="display: none;">
      <div class="modal">
        <div class="modal-header" id="modal-title">Save Progress</div>
        <div class="modal-content" id="modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="app.closeModal()">סגור</button>
        </div>
      </div>
    </div>

    <input type="file" id="file-import" accept=".json" onchange="app.importProgress(event)">

  <!-- Firebase compat SDK (matches the firebase.initializeApp / firebase.auth() / firebase.database() API used in js/firebase-init.js) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>

  <!-- Plain scripts (not type="module") so the app also works when this
       file is opened directly by double-clicking it (file://): browsers
       block module imports on file://, which would otherwise leave the
       page loaded but non-functional. Order matters - each file relies on
       globals declared by the ones before it. -->
  <script src="js/config.js"></script>
  <script src="js/words-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
